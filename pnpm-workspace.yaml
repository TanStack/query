cleanupUnusedCatalogs: true
minimumReleaseAge: 1440
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
shellEmulator: true
trustPolicy: 'no-downgrade'
trustPolicyExclude:
  - 'vite@6.4.1' # Socket score 94/100; popular and healthy.
  - 'semver@5.7.2' # Socket score 100/100; popular and healthy.
  - 'semver@6.3.1' # Socket score 100/100; popular and healthy.
  - 'ua-parser-js@1.0.41' # Socket score 100/100; popular and healthy.
  - 'undici-types@6.21.0' # Socket score 100/100; popular and healthy.

catalog:
  typescript: 6.0.3

  # react
  '@eslint-react/eslint-plugin': ^5.21.0
  '@testing-library/react': ^16.1.0
  '@types/react': ^19.2.7
  '@types/react-dom': ^19.2.3
  '@vitejs/plugin-react': ^6.1.1
  eslint-plugin-react-hooks: ^7.1.1
  react: ^19.2.1
  react-dom: ^19.2.1

  # preact
  '@preact/preset-vite': ^2.10.6
  '@testing-library/preact': ^3.2.4
  preact: ^10.29.8

  # solid
  '@solidjs/testing-library': ^0.8.10
  solid-js: ^1.9.15
  unplugin-solid: ^2.0.0
  vite-plugin-solid: ^2.11.14

  # svelte
  '@sveltejs/package': ^2.5.8
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@testing-library/svelte': ^5.2.8
  svelte: ^5.57.1
  svelte-check: ^4.4.5

  # vue
  unplugin-vue: ^8.0.0
  vue: ^3.5.43

  # angular
  '@analogjs/vite-plugin-angular': ^2.7.5
  '@angular/common': ^20.0.0
  '@angular/compiler': ^20.0.0
  '@angular/core': ^20.0.0
  '@angular/platform-browser': ^20.0.0
  '@testing-library/angular': ^18.0.0

packages:
  - 'packages/*'
  - 'integrations/*'
  - 'examples/angular/*'
  - 'examples/react/*'
  - 'examples/preact/*'
  - 'examples/lit/*'
  - 'examples/solid/*'
  - 'examples/svelte/*'
  - 'examples/vue/*'
  - '!examples/vue/2*'
  - '!examples/vue/nuxt*'

overrides:
  'chokidar': '5.0.0'
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  '@types/node': '^22.15.3'
  esbuild: '^0.28.2'

allowBuilds:
  # root dependency
  nx: true
  unrs-resolver: false # not directly required for build
  esbuild: true

  # vite
  fsevents: false # optional dependency

  # msw
  msw: false # used for example only

  # nx, @vitejs/plugin-react-swc, terser-webpack-plugin
  '@swc/core': true

  # @angular/build
  '@parcel/watcher': false # optional dep of @angular/build
  lmdb: false # optional dep of @angular/build
  msgpackr-extract: false # optional dep of @angular/build

  # @tanstack/vue-store
  vue-demi: false # only required for vue 2 support

  # nextJs
  sharp: false # not directly required for build
