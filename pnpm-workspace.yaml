cleanupUnusedCatalogs: true
minimumReleaseAge: 1440
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
trustPolicy: 'no-downgrade'
trustPolicyExclude:
  - 'vite@6.4.1' # Socket score 94/100; popular and healthy.
  - 'semver@5.7.2' # Socket score 100/100; popular and healthy.
  - 'semver@6.3.1' # Socket score 100/100; popular and healthy.
  - 'ua-parser-js@1.0.41' # Socket score 100/100; popular and healthy.
  - 'undici-types@6.21.0' # Socket score 100/100; popular and healthy.
minimumReleaseAgeExclude:
  - 'solid-js'
  - '@solidjs/*'
  - 'vite-plugin-solid'
  - 'babel-preset-solid'
  - 'babel-plugin-jsx-dom-expressions'
  - '@dom-expressions/*'
  - 'seroval'
  - 'seroval-plugins'

packages:
  - 'packages/*'
  - 'integrations/*'
  - 'examples/angular/*'
  - 'examples/react/*'
  - 'examples/preact/*'
  - 'examples/lit/*'
  - 'examples/solid/*'
  - 'examples/svelte/*'
  - 'examples/vue/*'
  - '!examples/vue/2*'
  - '!examples/vue/nuxt*'

overrides:
  'chokidar': '5.0.0'
  '@types/react': '^19.2.7'
  '@types/react-dom': '^19.2.3'
  '@types/node': '^22.15.3'
  '@typescript-eslint/eslint-plugin': '8.58.1'
  '@typescript-eslint/parser': '8.58.1'
  '@typescript-eslint/project-service': '8.58.1'
  '@typescript-eslint/rule-tester': '8.58.1'
  '@typescript-eslint/scope-manager': '8.58.1'
  '@typescript-eslint/tsconfig-utils': '8.58.1'
  '@typescript-eslint/type-utils': '8.58.1'
  '@typescript-eslint/types': '8.58.1'
  '@typescript-eslint/typescript-estree': '8.58.1'
  '@typescript-eslint/utils': '8.58.1'
  '@typescript-eslint/visitor-keys': '8.58.1'
  typescript-eslint: '8.58.1'
  vite: '^6.4.1'
  # The Solid 2.0 packages, their examples and the vite integration run on
  # vite 8: @solidjs/vite-plugin 3.0.0-next.32+ (the versions carrying the
  # Solid 2.0 compiler) require vite ^8. vitest takes vite as a peer, so the
  # packages' vitest gets its own vite-8 instance of the same version.
  '@tanstack/solid-query>vite': '^8.3.0'
  '@tanstack/solid-query-devtools>vite': '^8.3.0'
  '@tanstack/solid-query-persist-client>vite': '^8.3.0'
  '@tanstack/query-example-solid-basic>vite': '^8.3.0'
  '@tanstack/query-example-solid-basic-graphql-request>vite': '^8.3.0'
  '@tanstack/query-example-solid-default-query-function>vite': '^8.3.0'
  '@tanstack/query-example-solid-offline>vite': '^8.3.0'
  '@tanstack/query-example-solid-simple>vite': '^8.3.0'
  'solid-vite>vite': '^8.3.0'
  esbuild: '^0.27.2'

allowBuilds:
  # root dependency
  nx: true
  unrs-resolver: false # not directly required for build
  esbuild: true

  # vite
  fsevents: false # optional dependency

  # msw
  msw: false # used for example only

  # nx, @vitejs/plugin-react-swc, terser-webpack-plugin
  '@swc/core': true

  # @angular/build
  '@parcel/watcher': false # optional dep of @angular/build
  lmdb: false # optional dep of @angular/build
  msgpackr-extract: false # optional dep of @angular/build

  # @tanstack/vue-store
  vue-demi: false # only required for vue 2 support

  # nextJs
  sharp: false # not directly required for build
