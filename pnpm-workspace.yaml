cleanupUnusedCatalogs: true
minimumReleaseAge: 1440
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
shellEmulator: true
trustPolicy: 'no-downgrade'
trustPolicyExclude:
  - 'semver@5.7.2' # Socket score 100/100; popular and healthy.
  - 'semver@6.3.1' # Socket score 100/100; popular and healthy.
  - 'ua-parser-js@1.0.41' # Socket score 100/100; popular and healthy.
  - 'undici-types@6.21.0' # Socket score 100/100; popular and healthy.

catalog:
  typescript: 6.0.3
  '@typescript-eslint/parser': ^8.72.1
  '@typescript-eslint/rule-tester': ^8.72.1
  eslint: ^9.39.5

  # react
  '@eslint-react/eslint-plugin': ^5.28.8
  '@testing-library/react': ^16.3.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.2.1
  eslint-plugin-react-hooks: ^7.1.1
  react: ^19.3.1
  react-dom: ^19.3.1

  # preact
  '@preact/preset-vite': ^2.10.6
  '@testing-library/preact': ^3.2.6
  preact: ^11.2.0

  # solid
  '@solidjs/testing-library': ^0.8.10
  eslint-plugin-solid: ^0.19.0
  solid-js: ^1.9.18
  unplugin-solid: ^2.0.0
  vite-plugin-solid: ^2.11.15

  # svelte
  '@sveltejs/package': ^2.5.8
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@testing-library/svelte': ^5.4.2
  eslint-plugin-svelte: ^3.24.1
  svelte: ^5.57.3
  svelte-check: ^4.7.8

  # vue
  unplugin-vue: ^8.0.1
  vue: ^3.5.44

  # angular
  '@analogjs/vite-plugin-angular': ^2.9.6
  '@angular/common': ^22.2.5
  '@angular/compiler': ^22.2.5
  '@angular/core': ^22.2.5
  '@angular/platform-browser': ^22.2.5
  '@testing-library/angular': ^19.6.0

packages:
  - 'packages/*'
  - 'integrations/*/*'
  - 'examples/angular/*'
  - 'examples/react/*'
  - 'examples/preact/*'
  - 'examples/lit/*'
  - 'examples/solid/*'
  - 'examples/svelte/*'
  - 'examples/vue/*'
  - '!examples/vue/2*'

overrides:
  'chokidar': '5.0.0'
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  '@types/node': '^24.19.2'

allowBuilds:
  # root dependency
  nx: true
  unrs-resolver: false # not directly required for build
  esbuild: true

  # vite
  fsevents: false # optional dependency

  # msw
  msw: false # used for example only

  # nx, @vitejs/plugin-react-swc, terser-webpack-plugin
  '@swc/core': true

  # @angular/build
  '@parcel/watcher': false # optional dep of @angular/build
  lmdb: false # optional dep of @angular/build
  msgpackr-extract: false # optional dep of @angular/build

  # @tanstack/vue-store
  vue-demi: false # only required for vue 2 support

  # nextJs
  sharp: false # not directly required for build
